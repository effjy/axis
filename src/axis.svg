<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Axis">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0C0C0E"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151a24"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon tile -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bgGlow)" stroke="#26262c" stroke-width="6"/>

  <!-- Ambient axis glow behind the mark -->
  <path d="M256 96 L392 356 L120 356 Z" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.35" filter="url(#soft)"/>

  <!-- The "A" — two crystalline legs -->
  <g>
    <!-- Left leg (teal) -->
    <path d="M256 104 L150 372 L206 372 L256 236 Z" fill="url(#tealGrad)"/>
    <!-- Right leg (purple) -->
    <path d="M256 104 L362 372 L306 372 L256 236 Z" fill="url(#purpleGrad)"/>
    <!-- Bright leading edges -->
    <path d="M256 104 L150 372" fill="none" stroke="#7dffe9" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <path d="M256 104 L362 372" fill="none" stroke="#d0a5ff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Shield core (the crossbar of the A) -->
  <path d="M256 214 L316 246 L316 300 C316 340 256 366 256 366 C256 366 196 340 196 300 L196 246 Z"
        fill="url(#coreGrad)" stroke="url(#edgeGrad)" stroke-width="6"/>

  <!-- Keyhole -->
  <g fill="#00F5D4">
    <circle cx="256" cy="286" r="15"/>
    <path d="M248 296 L264 296 L269 332 L243 332 Z"/>
  </g>
  <circle cx="256" cy="286" r="15" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.9"/>
</svg>
