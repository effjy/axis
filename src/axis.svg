<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield Grid -->
  <rect width="512" height="512" rx="100" fill="#0C0C0E" stroke="#252529" stroke-width="8"/>
  
  <!-- Outer glowing path -->
  <path d="M 256,60 L 410,150 L 410,320 C 410,400 256,460 256,460 C 256,460 102,400 102,320 L 102,150 Z" 
        fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#glow)"/>
        
  <!-- Main Axis "A" Cyber Shield -->
  <g transform="translate(0, 10)">
    <!-- Left Leg of A (Teal) -->
    <path d="M 256,90 L 140,360 L 195,360 L 256,215 Z" fill="url(#tealGrad)" opacity="0.9"/>
    
    <!-- Right Leg of A (Purple) -->
    <path d="M 256,90 L 372,360 L 317,360 L 256,215 Z" fill="url(#purpleGrad)" opacity="0.9"/>
    
    <!-- Shield Core (Encapsulated security lock) -->
    <path d="M 256,180 L 320,220 L 320,300 C 320,340 256,370 256,370 C 256,370 192,340 192,300 L 192,220 Z" 
          fill="#121214" stroke="#00E5FF" stroke-width="6"/>
          
    <!-- Inner Lock Icon -->
    <circle cx="256" cy="255" r="16" fill="#A855F7" />
    <path d="M 250,265 L 262,265 L 266,305 L 246,305 Z" fill="#A855F7" />
  </g>
</svg>
